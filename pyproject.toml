[project]
name = "arxiv2md"
version = "0.1.0"
description = "Convert the HTML version of an arXiv paper to markdown files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
arxiv2md = "arxiv2md.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv2md"]

[dependency-groups]
dev = ["pytest>=8"]
